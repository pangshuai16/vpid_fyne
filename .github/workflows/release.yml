name: Release

# main 分支：构建并发布
# Windows XP x86 : MinGW-w64 (i686) + 静态 wxWidgets，产出单文件 exe，兼容 XP
# Linux amd64   : Rocky Linux 8 容器编译（glibc 2.28），静态/合并链接
on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-xp:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install i686 MinGW toolchain
        shell: pwsh
        run: choco install mingw -y --no-progress

      - name: Cache static wxWidgets (i686)
        id: cache-wx-xp
        uses: actions/cache@v4
        with:
          path: C:\wxbuild\install
          key: wx-static-i686-3.2.4

      - name: Build static wxWidgets 3.2 for Windows XP (i686)
        if: steps.cache-wx-xp.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # 32 位静态 wxWidgets：配置 MXW/MINW 工具链，定义 NT 5.1 API 集以兼容 XP
          $ver = "3.2.4"
          Invoke-WebRequest -Uri "https://github.com/wxWidgets/wxWidgets/releases/download/v$ver/wxWidgets-$ver.tar.bz2" -OutFile "$env:TEMP\wx.tar.bz2"
          New-Item -ItemType Directory -Force -Path C:\wxbuild | Out-Null
          cd C:\wxbuild
          tar -xjf "$env:TEMP\wx.tar.bz2"
          cd "wxWidgets-$ver"
          mkdir -p build-static
          cd build-static
          cmake -G "MinGW Makefiles" .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=C:\wxbuild\install `
            -DwxBUILD_SHARED=OFF `
            -DwxBUILD_MONOLITHIC=ON `
            -DwxUSE_STD_CONTAINERS=ON `
            -DCMAKE_CXX_FLAGS="/D_WIN32_WINNT=0x0501 /DWINVER=0x0501" `
            -DCMAKE_C_FLAGS="/D_WIN32_WINNT=0x0501 /DWINVER=0x0501"
          mingw32-make -j"$env:NUMBER_OF_PROCESSORS" install

      - name: Build vpid_viewer with CMake + MinGW
        shell: pwsh
        run: |
          cd native
          cmake -G "MinGW Makefiles" -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH=C:\wxbuild\install `
            -DCMAKE_SYSTEM_NAME=Windows `
            -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++ -mwindows"
          cmake --build build --config Release
          if (Test-Path "build/vpid_viewer.exe") {
              Write-Host "Build successful: build/vpid_viewer.exe"
              Get-Item "build/vpid_viewer.exe" | Select-Object Name, Length, LastWriteTime
          } else {
              Write-Error "Build failed: exe not found in build/"
              exit 1
          }

      - name: Rename release artifact
        shell: bash
        run: cp native/build/vpid_viewer.exe native/build/vpid_viewer_windows_xp.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows_xp
          path: native/build/vpid_viewer_windows_xp.exe
          retention-days: 30

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Rocky Linux 8 container (glibc 2.28)
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/rockylinux/rockylinux:8
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            # Rocky 8 = glibc 2.28，在此编译即可兼容所有 >=2.28 的发行版
            dnf install -y gcc-c++ make cmake libusb1-devel gtk3-devel libX11-devel pkgconfig
            cd native
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            # 记录 glibc 依赖版本，便于核验
            objdump -T build/vpid_viewer | grep -m1 GLIBC
            cp build/vpid_viewer build/vpid_viewer_linux_amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux_amd64
          path: native/build/vpid_viewer_linux_amd64
          retention-days: 30

  release:
    needs:
      - build-windows-xp
      - build-linux-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lhR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: artifacts/**/*
          generate_release_notes: true