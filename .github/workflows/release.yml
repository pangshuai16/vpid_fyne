name: Release

# main 分支：构建并发布
# Windows XP x86 : MSYS2 MINGW32 (i686) + 静态 wxWidgets，产出自包含的 32 位 exe，兼容 XP
# Linux amd64   : Rocky Linux 8 容器编译（glibc 2.28），静态/合并链接
on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-xp:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW32 (i686 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-pkgconf
            mingw-w64-i686-make
            make
            git

      - name: Cache static wxWidgets (i686)
        id: cache-wx-xp
        uses: actions/cache@v4
        with:
          path: C:\wxmsys32
          key: wx-static-i686-3.2.4-1

      - name: Build static wxWidgets 3.2 for Windows XP (i686, NT5.1)
        if: steps.cache-wx-xp.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -eux
          ver=3.2.4
          prefix=/c/wxmsys32
          mkdir -p /tmp/wxbuild && cd /tmp/wxbuild
          if [ ! -d "wxWidgets-$ver" ]; then
            curl -fsSLo wx.tar.bz2 "https://github.com/wxWidgets/wxWidgets/releases/download/v$ver/wxWidgets-$ver.tar.bz2"
            tar -xjf wx.tar.bz2
          fi
          cd "wxWidgets-$ver"
          rm -rf build-static && mkdir -p build-static && cd build-static
          # 修复 CMake 4.x 对旧 cmake_minimum_required 的兼容（wxWidgets 3.x 仍声明 CMake>=2.x）
          sed -i 's/^cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.10)/' ../CMakeLists.txt
          # 静态、monolithic，锁定 NT5.1 (XP) API 集
          cmake .. \
            -G "MinGW Makefiles" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DwxBUILD_SHARED=OFF \
            -DwxBUILD_MONOLITHIC=ON \
            -DwxUSE_STD_CONTAINERS=ON \
            -DwxUSE_GRAPHICS_CONTEXT=OFF \
            -DCMAKE_C_FLAGS="-D_WIN32_WINNT=0x0501 -DWINVER=0x0501" \
            -DCMAKE_CXX_FLAGS="-D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -fpermissive"
          cmake --build . -j"$(nproc)"
          cmake --install .

      - name: Build vpid_viewer (i686, static)
        shell: msys2 {0}
        run: |
          set -eux
          cd native
          export WXROOT="/c/wxmsys32"
          export PATH="$WXROOT/bin:$PATH"
          rm -rf build && mkdir -p build
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DwxWidgets_ROOT_DIR="$WXROOT" \
            -DCMAKE_C_FLAGS="-static-libgcc -D_WIN32_WINNT=0x0501 -DWINVER=0x0501" \
            -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++ -D_WIN32_WINNT=0x0501 -DWINVER=0x0501"
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer.exe
          file build/vpid_viewer.exe || true

      - name: Rename release artifact
        shell: msys2 {0}
        run: cp native/build/vpid_viewer.exe native/build/vpid_viewer_windows_xp.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows_xp
          path: native/build/vpid_viewer_windows_xp.exe
          retention-days: 30

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Rocky Linux 8 container (glibc 2.28)
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/rockylinux/rockylinux:8
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            # Rocky 8 = glibc 2.28，在此编译即可兼容所有 >=2.28 的发行版
            dnf install -y epel-release
            dnf install -y gcc-c++ make cmake libusb1-devel gtk3-devel wxGTK3-devel libX11-devel pkgconfig
            cd native
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            # 记录 glibc 依赖版本，便于核验
            objdump -T build/vpid_viewer | grep -m1 GLIBC
            cp build/vpid_viewer build/vpid_viewer_linux_amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux_amd64
          path: native/build/vpid_viewer_linux_amd64
          retention-days: 30

  release:
    needs:
      - build-windows-xp
      - build-linux-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lhR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: artifacts/**/*
          generate_release_notes: true