name: Release

# main 分支：构建并发布
# Windows XP x86 : 原生 Win32 API（无第三方 UI），MSYS2 MINGW32 (i686) 静态链接
# Linux amd64   : 原生 GTK3 + libusb，Rocky Linux 8 容器编译（glibc 2.28）
on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-xp:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW32 (i686 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            make
            git

      - name: Build vpid_viewer (i686, Win32 API, static)
        shell: msys2 {0}
        run: |
          set -eux
          cd native
          rm -rf build && mkdir -p build
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-static-libgcc" \
            -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer.exe
          cp build/vpid_viewer.exe build/vpid_viewer_windows_xp.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows_xp
          path: native/build/vpid_viewer_windows_xp.exe
          retention-days: 30

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Rocky Linux 8 container (glibc 2.28)
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/rockylinux/rockylinux:8
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            # Rocky 8 = glibc 2.28，在此编译即可兼容所有 >=2.28 的发行版
            dnf install -y epel-release
            dnf install -y gcc-c++ make cmake libusb1-devel gtk3-devel pkgconfig
            cd native
            rm -rf build && mkdir -p build
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            # 记录 glibc 依赖版本，便于核验
            objdump -T build/vpid_viewer | grep -m1 GLIBC
            cp build/vpid_viewer build/vpid_viewer_linux_amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux_amd64
          path: native/build/vpid_viewer_linux_amd64
          retention-days: 30

  release:
    needs:
      - build-windows-xp
      - build-linux-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lhR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: artifacts/**/*
          generate_release_notes: true