name: Build

# 非 main 分支：只构建，不发布
# Windows XP x86: MinGW-w64 (i686) 静态链接，产出兼容 XP 的单文件 exe
# Linux AMD64:   Rocky Linux 8 容器编译（glibc 2.28），静态合并链接
on:
  push:
    branches-ignore: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-xp:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 (i686) toolchain
        shell: pwsh
        run: choco install mingw -y --no-progress

      - name: Build with CMake + MinGW
        shell: pwsh
        run: |
          cd native
          cmake -G "MinGW Makefiles" -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build --config Release
          if (Test-Path "build/vpid_viewer.exe") {
              Write-Host "Build successful: build/vpid_viewer.exe"
              Get-Item "build/vpid_viewer.exe" | Select-Object Name, Length, LastWriteTime
          } else {
              Write-Error "Build failed: exe not found in build/"
              exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpid_viewer_windows_xp_${{ github.sha }}
          path: native/build/vpid_viewer.exe
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform_id: linux_amd64
            image: quay.io/rockylinux/rockylinux:8
            target: vpid_viewer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Rocky Linux 8 container (glibc 2.28)
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.image }}
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            dnf install -y gcc-c++ make cmake libusb1-devel gtk3-devel libX11-devel pkgconfig
            cd native
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            ls -lh build/vpid_viewer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpid_viewer_${{ matrix.platform_id }}_${{ github.sha }}
          path: native/build/vpid_viewer
          retention-days: 7