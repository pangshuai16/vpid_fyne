name: Build

# 非 main 分支：只构建，不发布
# Windows XP x86 : 原生 Win32 API（无第三方 UI），MSYS2 MINGW32 (i686) 静态链接
# Linux AMD64   : 原生 GTK3 + libusb，Rocky Linux 8 容器编译（glibc 2.28）
on:
  push:
    branches-ignore: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-xp:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW32 (i686 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            make
            git

      - name: Build vpid_viewer (i686, Win32 API, fully static)
        shell: msys2 {0}
        run: |
          set -eux
          cd native
          rm -rf build && mkdir -p build
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer.exe
          echo "=== imported DLLs (should be system libs only) ==="
          objdump -p build/vpid_viewer.exe | grep -E 'DLL Name' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpid_viewer_windows_xp_${{ github.sha }}
          path: native/build/vpid_viewer.exe
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build in Rocky Linux 8 container (glibc 2.28)
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/rockylinux/rockylinux:8
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            dnf install -y epel-release
            dnf install -y gcc-c++ make cmake libusb1-devel gtk3-devel pkgconfig
            cd native
            rm -rf build && mkdir -p build
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            ls -lh build/vpid_viewer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpid_viewer_linux_amd64_${{ github.sha }}
          path: native/build/vpid_viewer
          retention-days: 7